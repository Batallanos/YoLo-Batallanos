<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YoLo · Menú de controles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div>
    <h1 class="titulo">YoLo</h1>
    <p class="titulo">Menú de control</p>
  </div>

  <div>
    <h2 class="destacado">Estado</h2>
    <p id="estado">Robot detenido</p>
  </div>

  <div>
    <h2 class="destacado">Cámara</h2>
    <div id="camara">
      <p>Acá va a ir el video del robot.</p>
    </div>
  </div>

  <div>
    <h2 class="destacado">Controles</h2>
    <div id="controles">
      <button data-comando="adelante">Avanzar</button>
      <button data-comando="izquierda">Izquierda</button>
      <button data-comando="stop">Detener</button>
      <button data-comando="derecha">Derecha</button>
      <button data-comando="atras">Retroceder</button>
    </div>
  </div>

  <div>
    <h2 class="destacado">Últimos comandos</h2>
    <ul id="historial"></ul>
  </div>

  <div>
    <p class="destacado">Proyecto YoLo · Software II · 5.º año · Batallanos Facundo</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
